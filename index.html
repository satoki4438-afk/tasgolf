<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TasGolf</title>
<style>
/* ── カラーパレット（ネイビー×ゴールド×クリーム） ── */
:root {
  --navy:    #1c2b3a;
  --navy2:   #243447;
  --gold:    #b8943f;
  --gold-lt: #d4b068;
  --cream:   #f8f5ef;
  --cream2:  #f0ece3;
  --border:  #e2ddd4;
  --text:    #1c2b3a;
  --muted:   #7a8899;
  --white:   #ffffff;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--cream);
  font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
  color: var(--text);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.6;
}

/* ── ヘッダー ── */
header {
  background: var(--navy);
  color: white;
  padding: 18px 20px;
  position: sticky; top: 0; z-index: 100;
  display: flex; justify-content: space-between; align-items: center;
  box-shadow: 0 2px 16px rgba(28,43,58,0.35);
}
.logo {
  display: flex; align-items: center; gap: 10px;
  font-size: 18px; font-weight: 700; letter-spacing: 4px;
  text-transform: uppercase;
}
.logo-line { width: 1px; height: 18px; background: var(--gold); opacity: 0.6; }
.logo-sub { font-size: 10px; font-weight: 400; color: var(--gold-lt); letter-spacing: 2px; margin-top: 2px; }
.badge {
  font-size: 10px; font-weight: 600; color: var(--gold-lt);
  border: 1px solid rgba(184,148,63,0.4);
  padding: 4px 12px; border-radius: 4px; letter-spacing: 2px;
}

/* ── メイン ── */
main { max-width: 620px; margin: 0 auto; padding: 24px 16px 120px; }

/* ── タブ ── */
.tabs {
  display: flex; background: var(--cream2);
  border: 1px solid var(--border);
  border-radius: 10px; padding: 4px; margin-bottom: 24px; gap: 3px;
}
.tab-btn {
  flex: 1; padding: 12px 4px; border-radius: 7px;
  font-size: 13px; font-weight: 600; border: none;
  background: transparent; color: var(--muted);
  cursor: pointer; transition: all 0.2s;
  white-space: nowrap; font-family: inherit;
}
.tab-btn.active {
  background: var(--navy); color: white;
  box-shadow: 0 2px 8px rgba(28,43,58,0.25);
}

/* ── カード ── */
.card {
  background: var(--white);
  border-radius: 12px;
  border: 1px solid var(--border);
  padding: 24px; margin-bottom: 16px;
  box-shadow: 0 1px 6px rgba(28,43,58,0.06);
}
.card-title {
  font-size: 11px; font-weight: 700; letter-spacing: 3px;
  text-transform: uppercase; color: var(--gold);
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--cream2);
}
.section-label {
  font-size: 12px; font-weight: 700; color: var(--muted);
  margin-bottom: 10px; letter-spacing: 1px;
}
.form-group { margin-bottom: 20px; }

/* ── フォーム ── */
input[type="date"], input[type="number"], input[type="text"], select {
  width: 100%; padding: 14px 16px;
  background: var(--cream); border: 1px solid var(--border);
  border-radius: 8px; font-size: 15px; font-weight: 600; outline: none;
  font-family: inherit; color: var(--text);
  -webkit-appearance: none; appearance: none;
  transition: border-color 0.2s;
}
input:focus, select:focus { border-color: var(--gold); background: white; }

/* ── トグルボタン ── */
.btn-group { display: flex; gap: 8px; }
.toggle-btn {
  flex: 1; padding: 13px 6px; border-radius: 8px;
  font-size: 14px; font-weight: 600;
  border: 1px solid var(--border); background: var(--cream);
  color: var(--muted); cursor: pointer; transition: all 0.2s; font-family: inherit;
}
.toggle-btn.active {
  background: var(--navy); color: white; border-color: var(--navy);
  box-shadow: 0 2px 8px rgba(28,43,58,0.2);
}

/* ── タグ ── */
.tag-list { display: flex; flex-wrap: wrap; gap: 10px; }
.tag-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 18px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--cream);
  font-size: 13px; font-weight: 600; color: var(--muted);
  cursor: pointer; transition: all 0.2s; font-family: inherit;
}
.tag-btn.on-yellow { border-color: var(--gold); background: #fdf8ee; color: #7a5c1a; }
.tag-btn.on-blue   { border-color: #5b8db8; background: #eef4fa; color: #1e4d7a; }
.tag-btn.on-purple { border-color: #8b72b8; background: #f2eefa; color: #4a2e8a; }
.tag-btn.on-green  { border-color: #4a9068; background: #edf6f1; color: #1e5c3a; }
.tag-btn.on-amber  { border-color: #c08832; background: #fdf3e3; color: #7a4e0e; }
.tag-btn.on-rose   { border-color: #b86878; background: #faeef0; color: #7a2a38; }

/* ── プログレスバー ── */
.progress-bar {
  background: var(--cream2); border-radius: 99px;
  height: 5px; overflow: hidden; margin-bottom: 18px;
}
.progress-fill {
  background: linear-gradient(90deg, var(--gold), var(--gold-lt));
  height: 100%; border-radius: 99px; transition: width 0.5s ease;
}

/* ── チェックリスト ── */
.check-item {
  display: flex; align-items: center; gap: 14px;
  padding: 16px 18px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--white);
  cursor: pointer; transition: all 0.15s; margin-bottom: 8px;
}
.check-item:hover { border-color: var(--gold); background: #fdf8ee; }
.check-box {
  width: 26px; height: 26px; border-radius: 6px;
  border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all 0.2s; font-size: 13px; color: transparent;
}
.check-box.on { background: var(--navy); border-color: var(--navy); color: white; }
.check-label { font-size: 15px; font-weight: 600; }
.check-label.done { text-decoration: line-through; color: #bbb; }

/* ── スコアサマリー ── */
.score-summary {
  background: var(--navy);
  color: white; border-radius: 12px; padding: 28px; margin-bottom: 16px;
  position: relative; overflow: hidden;
}
.score-summary::before {
  content: '';
  position: absolute; top: -40px; right: -40px;
  width: 160px; height: 160px;
  border-radius: 50%;
  border: 1px solid rgba(184,148,63,0.15);
}
.score-summary::after {
  content: '';
  position: absolute; top: -20px; right: -20px;
  width: 100px; height: 100px;
  border-radius: 50%;
  border: 1px solid rgba(184,148,63,0.1);
}
.score-big { font-size: 64px; font-weight: 700; line-height: 1; letter-spacing: -2px; }
.score-sub { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 4px; letter-spacing: 2px; text-transform: uppercase; }
.score-diff { font-size: 28px; font-weight: 700; }
.d-over { color: #e88; } .d-under { color: var(--gold-lt); } .d-even { color: rgba(255,255,255,0.5); }
.score-grid {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  border-top: 1px solid rgba(255,255,255,0.08);
  padding-top: 20px; margin-top: 20px;
}
.sg-item { text-align: center; }
.sg-item:not(:last-child) { border-right: 1px solid rgba(255,255,255,0.08); }
.sg-val { font-size: 22px; font-weight: 700; }
.sg-label { font-size: 11px; color: rgba(255,255,255,0.3); margin-top: 4px; letter-spacing: 1px; text-transform: uppercase; }

/* ── ホール入力 ── */
.hole-row { display: flex; align-items: center; gap: 10px; padding: 10px 6px; border-radius: 8px; border-bottom: 1px solid var(--cream2); }
.hole-row:last-child { border-bottom: none; }
.hole-row:hover { background: var(--cream); }
.hole-num {
  width: 34px; height: 34px; background: var(--cream2);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: var(--muted); flex-shrink: 0;
}
.hole-par { font-size: 13px; color: var(--muted); flex: 1; font-weight: 600; }
.fw-btn {
  font-size: 11px; font-weight: 700; padding: 6px 10px; border-radius: 6px;
  border: 1px solid var(--border); cursor: pointer;
  background: var(--cream); color: var(--muted);
  font-family: inherit; transition: all 0.15s;
}
.fw-btn.on { background: var(--navy); color: white; border-color: var(--navy); }
.hole-input {
  width: 46px; text-align: center; padding: 8px 4px; border-radius: 6px;
  border: 1px solid var(--border); font-size: 15px; font-weight: 700;
  font-family: inherit; outline: none; background: var(--cream);
}
.hole-input:focus { border-color: var(--gold); background: white; }
.h-over { color: #cc3333; } .h-even { color: var(--muted); }
.h-birdie { color: #2a7a48; } .h-eagle { color: var(--gold); }
.putt-input {
  width: 38px; text-align: center; padding: 8px 2px; border-radius: 6px;
  border: 1px solid var(--border); font-size: 13px; font-weight: 600;
  font-family: inherit; outline: none; background: var(--cream); color: var(--muted);
}

/* ── コースカード ── */
.course-card {
  background: white; border-radius: 12px;
  border: 1px solid var(--border); padding: 22px; margin-bottom: 12px;
  transition: all 0.2s; cursor: pointer;
}
.course-card:hover { border-color: var(--gold); box-shadow: 0 4px 16px rgba(184,148,63,0.12); }
.course-icon { font-size: 32px; margin-bottom: 12px; }
.course-name { font-size: 16px; font-weight: 700; margin-bottom: 6px; color: var(--navy); }
.course-desc { font-size: 13px; color: var(--muted); margin-bottom: 14px; line-height: 1.5; }
.course-tags { display: flex; gap: 8px; }
.ct-green { font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: 4px; background: #edf6f1; color: #1e5c3a; border: 1px solid #c0dfd0; }
.ct-amber { font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: 4px; background: #fdf8ee; color: #7a5c1a; border: 1px solid #e8d49a; }

/* ── ギア ── */
.gear-item {
  background: white; padding: 16px 18px; border-radius: 8px;
  border: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
  transition: border-color 0.15s;
}
.gear-item:hover { border-color: var(--gold); }
.gear-name { font-size: 15px; font-weight: 600; }
.gear-cat-label {
  font-size: 11px; background: var(--cream2); color: var(--muted);
  padding: 3px 10px; border-radius: 4px; margin-left: 10px; font-weight: 600;
}
.gear-del { background: none; border: none; color: var(--border); cursor: pointer; font-size: 18px; padding: 4px 8px; transition: color 0.2s; }
.gear-del:hover { color: #cc3333; }

/* ── ギア バッグタブ ── */
.gear-bag-tabs {
  display: flex; background: var(--cream2); border: 1px solid var(--border);
  border-radius: 8px; padding: 3px; gap: 3px; margin-bottom: 20px;
}
.gear-bag-tab {
  flex: 1; padding: 12px; border-radius: 6px; font-size: 14px; font-weight: 600;
  border: none; background: transparent; color: var(--muted);
  cursor: pointer; font-family: inherit; transition: all 0.2s;
}
.gear-bag-tab.active {
  background: var(--navy); color: white;
  box-shadow: 0 2px 8px rgba(28,43,58,0.2);
}

/* ── クラブアコーディオン ── */
.club-section { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
.club-section-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 18px; cursor: pointer; background: white;
  transition: background 0.15s; user-select: none;
}
.club-section-header:hover { background: var(--cream); }
.club-section-title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; color: var(--navy); }
.club-section-meta { display: flex; align-items: center; gap: 8px; }
.club-count {
  font-size: 12px; font-weight: 700;
  background: var(--cream2); color: var(--muted);
  padding: 3px 10px; border-radius: 4px; border: 1px solid var(--border);
}
.club-chevron { font-size: 11px; color: var(--muted); transition: transform 0.2s; }
.club-chevron.open { transform: rotate(180deg); }
.club-section-body { display: none; padding: 0 14px 14px; background: var(--cream); border-top: 1px solid var(--border); }
.club-section-body.open { display: block; }
.club-add-row { display: flex; gap: 8px; margin-top: 12px; }
.club-add-input {
  flex: 1; padding: 12px 14px; background: white;
  border: 1px solid var(--border); border-radius: 8px;
  font-size: 14px; font-weight: 600; outline: none; font-family: inherit;
  transition: border-color 0.2s;
}
.club-add-input:focus { border-color: var(--gold); }
.club-add-btn {
  padding: 12px 18px; background: var(--navy); color: white;
  border: none; border-radius: 8px; font-size: 14px; font-weight: 700;
  cursor: pointer; font-family: inherit; white-space: nowrap;
  transition: background 0.15s;
}
.club-add-btn:hover { background: var(--navy2); }
.club-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 14px; background: white; border-radius: 8px;
  margin-top: 6px; border: 1px solid var(--border);
  transition: border-color 0.15s;
}
.club-item:hover { border-color: var(--gold); }
.club-item-name { font-size: 14px; font-weight: 600; }
.club-item-del { background: none; border: none; color: var(--border); cursor: pointer; font-size: 16px; transition: color 0.15s; padding: 2px 6px; }
.club-item-del:hover { color: #cc3333; }

/* ── ボタン ── */
.btn-primary {
  width: 100%; padding: 18px; background: var(--navy); color: white;
  font-weight: 700; font-size: 15px; border: none; border-radius: 8px;
  cursor: pointer; transition: all 0.15s;
  box-shadow: 0 4px 14px rgba(28,43,58,0.2); font-family: inherit;
  letter-spacing: 1px;
}
.btn-primary:hover { background: var(--navy2); }
.btn-primary:active { transform: scale(0.99); }
.btn-reset {
  width: 100%; padding: 14px; background: transparent; color: var(--muted);
  font-weight: 600; font-size: 13px; border: 1px solid var(--border);
  border-radius: 8px; cursor: pointer; font-family: inherit; margin-top: 12px;
  transition: all 0.15s;
}
.btn-reset:hover { border-color: var(--muted); color: var(--text); }

/* ── 空状態 ── */
.empty-state {
  text-align: center; padding: 60px 20px; background: white;
  border-radius: 12px; border: 1px dashed var(--border); color: var(--muted);
}
.empty-icon { font-size: 40px; margin-bottom: 14px; }
.empty-title { font-size: 14px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.empty-sub { font-size: 12px; color: #bbb; margin-top: 6px; }

/* ── トースト ── */
.toast {
  position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
  background: var(--navy); color: white; padding: 14px 28px;
  border-radius: 6px; font-size: 13px; font-weight: 600;
  display: flex; align-items: center; gap: 8px;
  box-shadow: 0 8px 24px rgba(28,43,58,0.35);
  transition: opacity 0.3s; z-index: 999; pointer-events: none;
  border-left: 3px solid var(--gold); letter-spacing: 0.5px;
}
.toast.hidden { opacity: 0; }

.gear-form-sub { display: none; }
.gear-form-sub.show { display: block; }

.tab-content { display: none; }
.tab-content.active { display: block; animation: fadeIn 0.25s ease; }
@keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
</style>
</head>
<body>

<header>
  <div class="logo">
    ⛳
    <div class="logo-line"></div>
    <div>
      <div>TasGolf</div>
      <div class="logo-sub">Golf Planner</div>
    </div>
  </div>
  <div class="badge">LOCAL</div>
</header>

<main>
  <div class="tabs">
    <button class="tab-btn active"  onclick="switchTab('plan',this)">プラン</button>
    <button class="tab-btn"         onclick="switchTab('score',this)">スコア</button>
    <button class="tab-btn"         onclick="switchTab('course',this)">コース</button>
    <button class="tab-btn"         onclick="switchTab('gear',this)">ギア</button>
  </div>

  <!-- プラン -->
  <div id="tab-plan" class="tab-content active">
    <div class="card">
      <div class="card-title">⛅ Round Conditions</div>
      <div class="form-group">
        <div class="section-label">日程</div>
        <input type="date" id="plan-date">
      </div>
      <div class="form-group">
        <div class="section-label">ラウンド</div>
        <div class="btn-group" id="grp-round">
          <button class="toggle-btn active" data-val="18h"      onclick="setGroup('grp-round',this)">18H</button>
          <button class="toggle-btn"        data-val="9h"       onclick="setGroup('grp-round',this)">9H</button>
          <button class="toggle-btn"        data-val="practice" onclick="setGroup('grp-round',this)">練習</button>
        </div>
      </div>
      <div class="form-group">
        <div class="section-label">スタイル</div>
        <div class="btn-group" id="grp-style">
          <button class="toggle-btn active" data-val="private" onclick="setGroup('grp-style',this)">プライベート</button>
          <button class="toggle-btn"        data-val="comp"    onclick="setGroup('grp-style',this)">競技</button>
          <button class="toggle-btn"        data-val="entertain" onclick="setGroup('grp-style',this)">接待</button>
        </div>
      </div>
      <div class="form-group">
        <div class="section-label">天気</div>
        <div class="btn-group" id="grp-weather">
          <button class="toggle-btn active" onclick="setGroup('grp-weather',this)">☀️ 晴れ</button>
          <button class="toggle-btn"        onclick="setGroup('grp-weather',this)">⛅ 曇り</button>
          <button class="toggle-btn"        onclick="setGroup('grp-weather',this)">🌧️ 雨</button>
          <button class="toggle-btn"        onclick="setGroup('grp-weather',this)">💨 風</button>
        </div>
      </div>
      <div class="form-group">
        <div class="section-label">目標スコア</div>
        <input type="number" id="plan-target" placeholder="例: 90" min="50" max="150">
      </div>
      <div class="form-group">
        <div class="section-label">今日のフォーカス</div>
        <div class="tag-list">
          <button class="tag-btn" data-color="on-yellow" onclick="toggleTag(this)">⚡ ドライバー</button>
          <button class="tag-btn" data-color="on-blue"   onclick="toggleTag(this)">🎯 アイアン</button>
          <button class="tag-btn" data-color="on-purple" onclick="toggleTag(this)">⭕ パター</button>
          <button class="tag-btn" data-color="on-green"  onclick="toggleTag(this)">🚩 アプローチ</button>
          <button class="tag-btn" data-color="on-amber"  onclick="toggleTag(this)">🏆 スコアメイク</button>
          <button class="tag-btn" data-color="on-rose"   onclick="toggleTag(this)">☕ 楽しむ</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <div class="card-title" style="margin:0">✅ 持ち物チェック</div>
        <span id="check-count" style="font-size:12px;font-weight:700;color:#a1a1aa">0/10</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <div id="checklist"></div>
    </div>
  </div>

  <!-- スコア -->
  <div id="tab-score" class="tab-content">
    <div class="score-summary">
      <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;">
        <div>
          <div class="score-big" id="total-score">–</div>
          <div class="score-sub">Total Score</div>
        </div>
        <div style="text-align:right">
          <div class="score-diff" id="score-diff">–</div>
          <div class="score-sub">vs Par 72</div>
        </div>
      </div>
      <div class="score-grid">
        <div class="sg-item"><div class="sg-val" id="out-score">–</div><div class="sg-label">OUT</div></div>
        <div class="sg-item"><div class="sg-val" id="in-score">–</div><div class="sg-label">IN</div></div>
        <div class="sg-item"><div class="sg-val" id="total-putts">–</div><div class="sg-label">Putts</div></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">📋 ホール別スコア</div>
      <div id="scorecard"></div>
      <button class="btn-reset" onclick="resetScore()">スコアをリセット</button>
    </div>
  </div>

  <!-- コース -->
  <div id="tab-course" class="tab-content">
    <div class="card">
      <div class="card-title">⛳ コース検索</div>
      <div class="form-group">
        <div class="section-label">都道府県</div>
        <select id="course-pref">
          <option value="">-- 都道府県を選択 --</option>
          <option value="1">北海道</option><option value="2">青森県</option><option value="3">岩手県</option>
          <option value="4">宮城県</option><option value="5">秋田県</option><option value="6">山形県</option>
          <option value="7">福島県</option><option value="8">茨城県</option><option value="9">栃木県</option>
          <option value="10">群馬県</option><option value="11">埼玉県</option><option value="12">千葉県</option>
          <option value="13">東京都</option><option value="14">神奈川県</option><option value="15">新潟県</option>
          <option value="16">富山県</option><option value="17">石川県</option><option value="18">福井県</option>
          <option value="19">山梨県</option><option value="20">長野県</option><option value="21">岐阜県</option>
          <option value="22">静岡県</option><option value="23">愛知県</option><option value="24">三重県</option>
          <option value="25">滋賀県</option><option value="26">京都府</option><option value="27">大阪府</option>
          <option value="28">兵庫県</option><option value="29">奈良県</option><option value="30">和歌山県</option>
          <option value="31">鳥取県</option><option value="32">島根県</option><option value="33">岡山県</option>
          <option value="34">広島県</option><option value="35">山口県</option><option value="36">徳島県</option>
          <option value="37">香川県</option><option value="38">愛媛県</option><option value="39">高知県</option>
          <option value="40">福岡県</option><option value="41">佐賀県</option><option value="42">長崎県</option>
          <option value="43">熊本県</option><option value="44">大分県</option><option value="45">宮崎県</option>
          <option value="46">鹿児島県</option><option value="47">沖縄県</option>
        </select>
      </div>
      <div class="form-group">
        <div class="section-label">コース名（任意）</div>
        <input type="text" id="course-keyword" placeholder="例：太平洋、よみうり">
      </div>
      <button class="btn-primary" onclick="searchCourses()">検索する</button>
    </div>
    <div id="course-loading" style="display:none;text-align:center;padding:40px;color:var(--muted);font-weight:600;">検索中...</div>
    <div id="course-results"></div>
  </div>

  <!-- ギア -->
  <div id="tab-gear" class="tab-content">

    <!-- レギュラー / サブ タブ -->
    <div class="gear-bag-tabs">
      <button class="gear-bag-tab active" onclick="switchBag('regular',this)">🟢 レギュラーバッグ</button>
      <button class="gear-bag-tab"        onclick="switchBag('sub',this)">🔵 サブバッグ</button>
    </div>

    <!-- クラブ アコーディオン -->
    <div class="card" style="padding:16px;">
      <div class="card-title">🏌️ クラブセット</div>
      <div id="club-accordion"></div>
    </div>

    <!-- その他ギア登録 -->
    <div class="card">
      <div class="card-title">🎒 その他ギアを登録</div>
      <div class="form-group">
        <input type="text" id="gear-name" placeholder="名前 (例: 距離測定器 GARMIN)">
      </div>
      <div class="form-group">
        <select id="gear-cat">
          <option value="balls">ボール・ティー</option>
          <option value="wear">ウェア</option>
          <option value="shoes">シューズ</option>
          <option value="bag">キャディバッグ</option>
          <option value="acc">アクセサリー</option>
          <option value="training">練習グッズ</option>
          <option value="other">その他</option>
        </select>
      </div>
      <button class="btn-primary" onclick="addGear()">追加する</button>
    </div>
    <div id="gear-list"></div>
  </div>
</main>

<div class="toast hidden" id="toast">✅ <span id="toast-msg"></span></div>

<script>
const CHECKLIST = [
  {id:"clubs", name:"クラブセット確認"},
  {id:"balls", name:"ボール（予備含む）"},
  {id:"tee",   name:"ティー・マーカー"},
  {id:"glove", name:"グローブ"},
  {id:"wear",  name:"ウェア上下"},
  {id:"shoes", name:"ゴルフシューズ"},
  {id:"rain",  name:"レインウェア"},
  {id:"sun",   name:"日焼け止め・帽子"},
  {id:"scope", name:"距離測定器"},
  {id:"score", name:"スコアカード・鉛筆"},
];

const PARS = [4,3,4,5,4,3,4,5,4,4,3,4,5,4,3,4,5,4];
const CAT_LABELS = {balls:"ボール・ティー",wear:"ウェア",shoes:"シューズ",bag:"キャディバッグ",acc:"アクセサリー",training:"練習グッズ",other:"その他"};
const ld = (k,d) => { try { const v=localStorage.getItem(k); return v?JSON.parse(v):d; } catch(e){return d;} };
const sv = (k,v) => { try { localStorage.setItem(k,JSON.stringify(v)); } catch(e){} };

// クラブカテゴリ定義
const CLUB_CATS = [
  {id:"driver", icon:"🏌️", label:"ドライバー"},
  {id:"fw",     icon:"🌲", label:"FW・UT"},
  {id:"iron",   icon:"🔩", label:"アイアン"},
  {id:"wedge",  icon:"⚙️", label:"ウェッジ"},
  {id:"putter", icon:"⭕", label:"パター"},
];

let checked  = ld('tg_checked', []);
let scores   = ld('tg_scores', Array(18).fill(''));
let putts    = ld('tg_putts',  Array(18).fill(''));
let fairways = ld('tg_fw',     Array(18).fill(false));
let currentBag = 'regular';
let clubs = ld('tg_clubs', {
  regular: {driver:[],fw:[],iron:[],wedge:[],putter:[]},
  sub:     {driver:[],fw:[],iron:[],wedge:[],putter:[]}
});
let gear = ld('tg_gear', []);
let openClubSections = new Set(['driver']);
let clubCheckOpen = false;

// Init
document.getElementById('plan-date').value = new Date().toISOString().split('T')[0];
renderChecklist();
renderScorecard();
updateSummary();

function switchBag(bag, btn) {
  currentBag = bag;
  document.querySelectorAll('.gear-bag-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderClubAccordion();
  renderGear();
}

function renderClubAccordion() {
  const el = document.getElementById('club-accordion');
  el.innerHTML = '';
  const bagData = clubs[currentBag];
  CLUB_CATS.forEach(cat => {
    const items = bagData[cat.id] || [];
    const isOpen = openClubSections.has(cat.id);
    const sec = document.createElement('div');
    sec.className = 'club-section';
    sec.innerHTML = `
      <div class="club-section-header" onclick="toggleClubSection('${cat.id}')">
        <div class="club-section-title">${cat.icon} ${cat.label}</div>
        <div class="club-section-meta">
          <span class="club-count">${items.length}本</span>
          <span class="club-chevron${isOpen?' open':''}">▼</span>
        </div>
      </div>
      <div class="club-section-body${isOpen?' open':''}">
        ${items.map(item => `
          <div class="club-item">
            <span class="club-item-name">${item.name}</span>
            <button class="club-item-del" onclick="deleteClub('${cat.id}',${item.id})">🗑</button>
          </div>
        `).join('')}
        <div class="club-add-row">
          <input class="club-add-input" type="text" id="club-input-${cat.id}" placeholder="例: TW GT 460 / 9.5°">
          <button class="club-add-btn" onclick="addClub('${cat.id}')">追加</button>
        </div>
      </div>
    `;
    el.appendChild(sec);
  });
}

function toggleClubSection(catId) {
  if (openClubSections.has(catId)) openClubSections.delete(catId);
  else openClubSections.add(catId);
  renderClubAccordion();
}

function addClub(catId) {
  const input = document.getElementById('club-input-'+catId);
  const name = input.value.trim();
  if (!name) return;
  if (!clubs[currentBag][catId]) clubs[currentBag][catId] = [];
  clubs[currentBag][catId].push({id: Date.now(), name});
  sv('tg_clubs', clubs);
  openClubSections.add(catId);
  renderClubAccordion();
  showToast('登録しました');
}

function deleteClub(catId, id) {
  clubs[currentBag][catId] = clubs[currentBag][catId].filter(x => x.id !== id);
  sv('tg_clubs', clubs);
  renderClubAccordion();
}

function addGear() {
  const name = document.getElementById('gear-name').value.trim();
  const cat  = document.getElementById('gear-cat').value;
  if (!name) return;
  gear.push({id: Date.now(), name, cat, bag: currentBag});
  sv('tg_gear', gear);
  document.getElementById('gear-name').value = '';
  renderGear();
  showToast('登録しました');
}

function renderGear() {
  const el = document.getElementById('gear-list');
  const filtered = gear.filter(g => g.bag === currentBag);
  if (!filtered.length) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">🎒</div><div class="empty-title">No Gear Yet</div><div class="empty-sub">ギアを登録してみよう</div></div>';
    return;
  }
  el.innerHTML = '';
  filtered.forEach(g => {
    const d = document.createElement('div');
    d.className = 'gear-item';
    d.innerHTML = `<div><span class="gear-name">${g.name}</span><span class="gear-cat-label">${CAT_LABELS[g.cat]||g.cat}</span></div><button class="gear-del" onclick="deleteGear(${g.id})">🗑</button>`;
    el.appendChild(d);
  });
}

function deleteGear(id) {
  gear = gear.filter(g => g.id !== id);
  sv('tg_gear', gear);
  renderGear();
}

// Init ギア
renderClubAccordion();
renderGear();

function switchTab(t, btn) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  btn.classList.add('active');
}

function setGroup(groupId, btn) {
  document.querySelectorAll('#'+groupId+' .toggle-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function toggleTag(btn) {
  const color = btn.dataset.color;
  if (btn.classList.contains(color)) {
    btn.classList.remove(color);
  } else {
    btn.className = 'tag-btn ' + color;
  }
}


function renderChecklist() {
  const chkSet = new Set(checked);
  const el = document.getElementById('checklist');
  el.innerHTML = '';

  // レギュラーバッグの全クラブをフラットに取得
  const regularClubs = CLUB_CATS.flatMap(cat =>
    (clubs.regular[cat.id] || []).map(item => ({
      id: 'club_' + item.id,
      name: item.name,
      catLabel: cat.label,
      catIcon: cat.icon,
    }))
  );

  CHECKLIST.forEach(item => {
    if (item.id === 'clubs') {
      const checkedClubs = regularClubs.filter(c => chkSet.has(c.id));
      const allDone = regularClubs.length > 0 && checkedClubs.length === regularClubs.length;
      const hasClubs = regularClubs.length > 0;

      const wrap = document.createElement('div');
      wrap.style.marginBottom = '8px';

      // ヘッダー行
      const header = document.createElement('div');
      header.className = 'check-item';
      header.style.cssText = `border-radius:${clubCheckOpen && hasClubs ? '16px 16px 0 0' : '16px'};${clubCheckOpen && hasClubs ? 'border-bottom:1px solid #f4f4f5;' : ''}cursor:pointer;`;
      header.innerHTML = `
        <div class="check-box${allDone?' on':''}">✓</div>
        <span class="check-label" style="flex:1;${allDone?'text-decoration:line-through;color:#d4d4d8':''}">クラブセット確認</span>
        ${hasClubs ? `<span style="font-size:11px;color:#a1a1aa;font-weight:700;margin-right:6px;">${checkedClubs.length}/${regularClubs.length}</span>` : ''}
        <span style="font-size:11px;color:#a1a1aa;display:inline-block;transition:transform 0.2s;transform:rotate(${clubCheckOpen?'180':'0'}deg)">▼</span>
      `;
      header.onclick = () => {
        clubCheckOpen = !clubCheckOpen;
        renderChecklist();
      };
      wrap.appendChild(header);

      // 展開ツリー
      if (clubCheckOpen) {
        const tree = document.createElement('div');
        tree.style.cssText = 'background:#fafaf9;border:1px solid #f4f4f5;border-top:none;border-radius:0 0 16px 16px;padding:8px 12px 10px;';

        CLUB_CATS.forEach(cat => {
          const catItems = clubs.regular[cat.id] || [];

          // カテゴリヘッダー（常に表示）
          const catLabel = document.createElement('div');
          catLabel.style.cssText = 'font-size:10px;font-weight:700;color:#a1a1aa;text-transform:uppercase;letter-spacing:1px;margin:10px 0 4px 4px;display:flex;align-items:center;gap:4px;';
          catLabel.textContent = cat.icon + ' ' + cat.label;
          tree.appendChild(catLabel);

          if (!catItems.length) {
            // 未登録の場合はプレースホルダー
            const ph = document.createElement('div');
            ph.style.cssText = 'padding:8px 10px;font-size:11px;color:#d4d4d8;font-weight:600;font-style:italic;';
            ph.textContent = '未登録';
            tree.appendChild(ph);
            return;
          }

          catItems.forEach(item => {
            const cid = 'club_' + item.id;
            const cdone = chkSet.has(cid);
            const row = document.createElement('div');
            row.style.cssText = 'display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;background:white;margin-bottom:4px;border:1px solid #f4f4f5;';
            row.innerHTML = `
              <div class="check-box${cdone?' on':''}" style="width:20px;height:20px;border-radius:6px;font-size:10px;">✓</div>
              <span style="font-size:12px;font-weight:700;${cdone?'text-decoration:line-through;color:#d4d4d8':''}">${item.name}</span>
            `;
            row.onclick = (e) => {
              e.stopPropagation();
              checked = cdone ? checked.filter(x => x !== cid) : [...checked, cid];
              sv('tg_checked', checked);
              renderChecklist();
            };
            tree.appendChild(row);
          });
        });
        wrap.appendChild(tree);
      }

      el.appendChild(wrap);
      return;
    }

    // 通常チェック行
    const done = chkSet.has(item.id);
    const d = document.createElement('div');
    d.className = 'check-item';
    d.innerHTML = `<div class="check-box${done?' on':''}">✓</div><span class="check-label${done?' done':''}">${item.name}</span>`;
    d.onclick = () => {
      checked = done ? checked.filter(x=>x!==item.id) : [...checked, item.id];
      sv('tg_checked', checked);
      renderChecklist();
    };
    el.appendChild(d);
  });

  // カウント（クラブの子チェックも含める）
  const clubChildChecked = regularClubs.filter(c => chkSet.has(c.id)).length;
  const clubChildTotal = regularClubs.length;
  const nonClubChecked = CHECKLIST.filter(i => i.id !== 'clubs' && chkSet.has(i.id)).length;
  const cnt = nonClubChecked + (clubChildTotal > 0 ? (clubChildChecked === clubChildTotal ? 1 : 0) : (chkSet.has('clubs') ? 1 : 0));
  const total = CHECKLIST.length;
  document.getElementById('check-count').textContent = cnt+'/'+total;
  document.getElementById('progress-fill').style.width = (cnt/total*100)+'%';
}

function renderScorecard() {
  const el = document.getElementById('scorecard');
  el.innerHTML = '';
  for (let i=0; i<18; i++) {
    const par = PARS[i];
    const s = scores[i];
    const diff = s !== '' ? parseInt(s) - par : null;
    let hcls = '';
    if (diff !== null) hcls = diff <= -2 ? 'h-eagle' : diff === -1 ? 'h-birdie' : diff === 0 ? 'h-even' : 'h-over';
    const row = document.createElement('div');
    row.className = 'hole-row';
    row.innerHTML = `
      <div class="hole-num">${i+1}</div>
      <div class="hole-par">Par ${par}</div>
      <button class="fw-btn${fairways[i]?' on':''}" data-i="${i}" onclick="toggleFW(${i},this)">FW</button>
      <input class="putt-input" type="number" placeholder="P" value="${putts[i]}" min="0" max="9"
        oninput="onPutt(${i},this.value)">
      <input class="hole-input ${hcls}" type="number" placeholder="–" value="${scores[i]}" min="1" max="20"
        oninput="onScore(${i},this)">
    `;
    el.appendChild(row);
  }
}

function toggleFW(i, btn) {
  fairways[i] = !fairways[i];
  sv('tg_fw', fairways);
  btn.classList.toggle('on', fairways[i]);
}

function onScore(i, input) {
  scores[i] = input.value;
  sv('tg_scores', scores);
  const par = PARS[i];
  const diff = input.value !== '' ? parseInt(input.value) - par : null;
  input.className = 'hole-input';
  if (diff !== null) input.classList.add(diff <= -2 ? 'h-eagle' : diff === -1 ? 'h-birdie' : diff === 0 ? 'h-even' : 'h-over');
  updateSummary();
}

function onPutt(i, val) {
  putts[i] = val;
  sv('tg_putts', putts);
  updateSummary();
}

function updateSummary() {
  const total = scores.reduce((s,v)=>s+(parseInt(v)||0),0);
  const out   = scores.slice(0,9).reduce((s,v)=>s+(parseInt(v)||0),0);
  const inS   = scores.slice(9).reduce((s,v)=>s+(parseInt(v)||0),0);
  const tp    = putts.reduce((s,v)=>s+(parseInt(v)||0),0);
  const filled = scores.filter(v=>v!=='').length;
  const totalPar = PARS.reduce((a,b)=>a+b,0);

  document.getElementById('total-score').textContent = filled ? total : '–';
  document.getElementById('out-score').textContent   = scores.slice(0,9).some(v=>v!=='') ? out : '–';
  document.getElementById('in-score').textContent    = scores.slice(9).some(v=>v!=='') ? inS : '–';
  document.getElementById('total-putts').textContent = putts.some(v=>v!=='') ? tp : '–';

  const diffEl = document.getElementById('score-diff');
  if (filled) {
    const diff = total - totalPar;
    diffEl.textContent = diff > 0 ? '+'+diff : diff === 0 ? 'E' : String(diff);
    diffEl.className = 'score-diff ' + (diff > 0 ? 'd-over' : diff < 0 ? 'd-under' : 'd-even');
  } else {
    diffEl.textContent = '–';
    diffEl.className = 'score-diff';
  }
}

function resetScore() {
  if (!confirm('スコアをリセットしますか？')) return;
  scores = Array(18).fill(''); putts = Array(18).fill(''); fairways = Array(18).fill(false);
  sv('tg_scores', scores); sv('tg_putts', putts); sv('tg_fw', fairways);
  renderScorecard(); updateSummary();
  showToast('リセットしました');
}


let toastTimer;
function showToast(msg) {
  clearTimeout(toastTimer);
  const el = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  el.classList.remove('hidden');
  toastTimer = setTimeout(() => el.classList.add('hidden'), 2500);
}

// ── 楽天GORA コース検索 ──
const RAKUTEN_APP_ID  = '73bd8715-0e73-4b38-bb72-d75ec758c7d9';
const RAKUTEN_AFF_ID  = '51dec36d.bb33393a.51dec36e.c6f5673d';

async function searchCourses() {
  const pref    = document.getElementById('course-pref').value;
  const keyword = document.getElementById('course-keyword').value.trim();

  if (!pref && !keyword) {
    showToast('都道府県またはコース名を入力してください');
    return;
  }

  document.getElementById('course-loading').style.display = 'block';
  document.getElementById('course-results').innerHTML = '';

  const params = new URLSearchParams({
    applicationId: RAKUTEN_APP_ID,
    affiliateId:   RAKUTEN_AFF_ID,
    format:        'json',
    hits:          10,
  });
  if (pref)    params.set('areaCode', pref);
  if (keyword) params.set('keyword',  keyword);

  try {
    const res  = await fetch(`https://openapi.rakuten.co.jp/engine/api/Gora/GoraGolfCourseSearch/20170623?${params}`);
    const data = await res.json();
    document.getElementById('course-loading').style.display = 'none';

    if (!data.Items || data.Items.length === 0) {
      document.getElementById('course-results').innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🔍</div>
          <div class="empty-title">見つかりませんでした</div>
          <div class="empty-sub">条件を変えて再検索してください</div>
        </div>`;
      return;
    }

    const html = data.Items.map(({Item: c}) => `
      <div class="course-card">
        <div style="display:flex;gap:14px;align-items:flex-start;">
          ${c.golfCourseImageUrl
            ? `<img src="${c.golfCourseImageUrl}" style="width:72px;height:72px;object-fit:cover;border-radius:8px;flex-shrink:0;border:1px solid var(--border);">`
            : `<div style="width:72px;height:72px;background:var(--cream2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;">⛳</div>`
          }
          <div style="flex:1;min-width:0;">
            <div class="course-name" style="font-size:15px;">${c.golfCourseName}</div>
            <div class="course-desc">${c.prefecture || ''} ${c.address || ''}</div>
            ${c.evaluation ? `<div style="font-size:12px;color:var(--gold);font-weight:700;margin-bottom:8px;">★ ${c.evaluation}</div>` : ''}
            <div class="course-tags" style="flex-wrap:wrap;gap:6px;">
              ${c.minPrice ? `<span class="ct-green">￥${Number(c.minPrice).toLocaleString()}〜</span>` : ''}
              ${c.holes    ? `<span class="ct-amber">${c.holes}H</span>` : ''}
            </div>
          </div>
        </div>
        <a href="${c.golfCourseDetailUrl || '#'}" target="_blank" rel="noopener"
          style="display:block;margin-top:14px;text-align:center;padding:12px;background:var(--navy);color:white;border-radius:8px;font-size:13px;font-weight:700;text-decoration:none;letter-spacing:1px;">
          楽天GORAで予約する →
        </a>
      </div>
    `).join('');

    document.getElementById('course-results').innerHTML = html;

  } catch(e) {
    document.getElementById('course-loading').style.display = 'none';
    document.getElementById('course-results').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">⚠️</div>
        <div class="empty-title">通信エラー</div>
        <div class="empty-sub">しばらく経ってから再試行してください</div>
      </div>`;
  }
}
</script>
</body>
</html>
